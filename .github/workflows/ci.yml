name: CI

on:
  push:
    branches: ["main", "polish/**"]
  pull_request:
    branches: ["main", "polish/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint + test tools
        run: pip install ruff pytest

      - name: Ruff lint
        run: python -m ruff check .

      - name: Run tests (headless — no cv2/mediapipe/pygame at import time)
        # mediapipe and opencv-contrib-python are NOT installed here.
        # All tests must use lazy imports or injectable backends so that
        # pytest can collect and run without those native libraries.
        run: python -m pytest tests/ -v
