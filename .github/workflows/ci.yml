name: CI

on:
  push:
    branches: ["main", "polish/**"]
  pull_request:
    branches: ["main", "polish/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint + test tools
        run: pip install ruff pytest numpy==1.26.4

      - name: Ruff lint
        run: python -m ruff check .

      - name: Run tests (headless — no cv2/mediapipe/pygame at import time)
        # Runtime deps (mediapipe, opencv-contrib-python, pygame) are NOT installed.
        # numpy is installed so that monitor.py/detection.py can be imported.
        # All tests use lazy imports or injectable backends (no cv2/mediapipe at
        # collection time). See requirements.txt for the full verified pin set.
        run: python -m pytest tests/ -v
